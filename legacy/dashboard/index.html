<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dashboard — pavlus example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 34rem;
        margin: 2.5rem auto;
        color: #1f2430;
        background: #fafafa;
      }
      .title {
        font-size: 1.4rem;
        margin: 0 0 0.75rem;
      }
      .status--error {
        color: #b3261e;
      }
      .empty {
        color: #6b7280;
        font-style: italic;
      }
      .list {
        list-style: none;
        margin: 0 0 1rem;
        padding: 0;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        align-items: baseline;
        padding: 0.4rem 0;
        border-bottom: 1px solid #e5e7eb;
      }
      .name {
        font-weight: 600;
        min-width: 9rem;
      }
      .email {
        color: #6b7280;
        flex: 1;
      }
      button {
        font: inherit;
        padding: 0.3rem 0.8rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #9ca3af;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .new {
        margin-bottom: 0.75rem;
      }
      .card {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        max-width: 24rem;
      }
      .card h2 {
        margin: 0;
        font-size: 1.05rem;
      }
      .fields {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      input {
        font: inherit;
        padding: 0.35rem 0.6rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
      }
      .save {
        background: #1f2430;
        border-color: #1f2430;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
