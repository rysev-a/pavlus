# Postgres for Visual Design: `npm run db:up`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: visual_design
    ports:
      - "127.0.0.1:54340:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d visual_design"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
