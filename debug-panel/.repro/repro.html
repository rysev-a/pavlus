<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../extension/panel.css" />
    <script>
      // ---- chrome.* stubs so the real panel.js runs outside devtools ----
      const listeners = [];
      window.chrome = {
        runtime: {
          connect() {
            return {
              onMessage: { addListener: (fn) => listeners.push(fn) },
              onDisconnect: { addListener() {} },
              postMessage: (msg) => {
                if (msg && msg.cmd === "hello") {
                  // answer as the agent would: one app, one long-payload message
                  const long = "x".repeat(2000);
                  const step = {
                    type: "step",
                    appId: "app1",
                    seq: 1,
                    time: Date.now(),
                    from: "http",
                    message: { id: "users.loaded", payload: { token: long } },
                    effects: [
                      {
                        uid: "app1:1:0",
                        plugin: "dom",
                        type: "render",
                        time: Date.now(),
                        summary: "render #app",
                        detail: { selector: "#app", patches: 12 },
                        dur: 3,
                      },
                    ],
                    comps: [""],
                  };
                  const fx2 = {
                    type: "step",
                    appId: "app1",
                    seq: 2,
                    time: Date.now(),
                    message: { id: "mounted", payload: { a: 1 } },
                    effects: [],
                    comps: [""],
                  };
                  setTimeout(
                    () =>
                      listeners.forEach((fn) =>
                        fn({
                          source: "__pavlus_agent__",
                          type: "hello",
                          apps: [
                            {
                              id: "app1",
                              name: "admin-app",
                              plugins: ["store", "dom", "http"],
                              hasStore: true,
                            },
                          ],
                          state: { app1: { n: 1 } },
                          history: { app1: [] },
                          io: { app1: {} },
                          replay: [step, fx2],
                        }),
                      ),
                    50,
                  );
                }
              },
            };
          },
        },
        devtools: {
          inspectedWindow: { tabId: 1 },
          network: { onNavigated: { addListener() {} } },
        },
      };
    </script>
    <script src="../extension/panel.js" defer></script>
  </head>
  <body>
    <header id="bar">
      <span id="dot" class="off"></span>
      <span id="status">connecting…</span>
      <span class="spacer"></span>
      <button id="rescan">rescan</button>
    </header>
    <nav id="tabs">
      <button data-tab="console" class="active">Console</button>
      <button data-tab="messages">Messages</button>
      <button data-tab="effects">Effects</button>
      <button data-tab="store">Store</button>
      <button data-tab="travel">Time travel</button>
      <button data-tab="apps">Apps</button>
    </nav>
    <main id="view">
      <section id="tab-console" class="tab active"></section>
      <section id="tab-messages" class="tab"></section>
      <section id="tab-effects" class="tab">
        <div id="chips"></div>
      </section>
      <section id="tab-store" class="tab"></section>
      <section id="tab-travel" class="tab"></section>
      <section id="tab-apps" class="tab"></section>
    </main>
    <script>
      // open the first message in the console once it rendered
      setTimeout(() => {
        const row = document.querySelector("#console-rows .c-msg");
        if (row) row.click();
      }, 900);
    </script>
  </body>
</html>
