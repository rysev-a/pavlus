# Builds the ui-kit (every shadcn component as a pavlus template) and the phone
# app (applications/mobile-dev) and publishes them on GitHub Pages: the ui-kit at
# /<repo>/ and the phone app at /<repo>/mobile/. Pull requests only build and
# test; the deploy runs on main.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: ui-kit pages

on:
  push:
    branches: [main]
    paths:
      - "framework/ui-kit/**"
      - "applications/admin/public/styles.css"
      - "framework/**"
      - "applications/mobile-dev/**"
      - "package-lock.json"
      - ".github/workflows/ui-kit-pages.yml"
  pull_request:
    paths:
      - "framework/ui-kit/**"
      - "applications/admin/public/styles.css"
      - "framework/**"
      - "applications/mobile-dev/**"
      - "package-lock.json"
      - ".github/workflows/ui-kit-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @pavlus/ui-kit
      - run: npm test --workspace @pavlus/ui-kit
      - name: Build for the project site (/<repo>/)
        run: npm run build --workspace @pavlus/ui-kit
        env:
          UI_KIT_BASE: /${{ github.event.repository.name }}/
      - run: npm run typecheck --workspace mobile-dev
      - run: npm test --workspace mobile-dev
      - name: Build the phone app for /<repo>/mobile/
        run: npm run build --workspace mobile-dev
        env:
          MOBILE_BASE: /${{ github.event.repository.name }}/mobile/
      - name: Put the phone app inside the site
        run: cp -R applications/mobile-dev/dist framework/ui-kit/dist/mobile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: framework/ui-kit/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
