<svg id="flowviz-svg" xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1240" height="700" fill="#f6f8fa"/>
<text x="24" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2430" font-weight="600" xml:space="preserve">One pure application — plugins do every dirty thing</text>
<text x="1216" y="34" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="end" font-style="italic" xml:space="preserve">messages in → effects out</text>
<rect x="60" y="56" width="330" height="372" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="6 4"/>
<text x="76" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#4f46e5" font-weight="600" xml:space="preserve">YOUR APPLICATION</text>
<rect data-node="app" x="85" y="96" width="280" height="118" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.6"/>
<text x="225" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="600" xml:space="preserve">application</text>
<text x="225" y="144" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#7c3aed" text-anchor="middle" xml:space="preserve">app(message, state) → Effect[]</text>
<text x="225" y="164" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">no Date.now(), no fetch(),</text>
<text x="225" y="180" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">no DOM — handlers are pure</text>
<text x="225" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#98a2b3" text-anchor="middle" font-style="italic" xml:space="preserve">the only code you write</text>
<rect data-node="core" x="85" y="282" width="280" height="128" rx="10" fill="#ffffff" stroke="#d4d9e0"/>
<text x="225" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="600" xml:space="preserve">core — createApp()</text>
<text x="225" y="330" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">queue → app(msg, state)</text>
<text x="225" y="346" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">effects → plugins, in order</text>
<text x="225" y="362" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">state changed → onState(all)</text>
<text x="225" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#98a2b3" text-anchor="middle" font-style="italic" xml:space="preserve">the only code that calls the app</text>
<line x1="185" y1="278" x2="185" y2="218" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="185,218 181,227 189,227" fill="#2563eb"/>
<text x="175" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="end" font-style="italic" xml:space="preserve">app(msg, state)</text>
<line x1="265" y1="218" x2="265" y2="278" stroke="#7c3aed" stroke-width="1.6"/>
<polygon points="265,278 269,269 261,269" fill="#7c3aed"/>
<text x="275" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="start" font-style="italic" xml:space="preserve">Effect[] — data</text>
<text x="680" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="middle" font-style="italic" xml:space="preserve">plugins — all the dirty work</text>
<rect data-node="dom" x="520" y="92" width="320" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
<text x="680" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#d97706" text-anchor="middle" font-weight="600" xml:space="preserve">dom plugin</text>
<text x="680" y="140" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">build(vnodes) · apply(patches)</text>
<text x="680" y="156" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">owns every listener</text>
<text x="680" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#98a2b3" text-anchor="middle" font-style="italic" xml:space="preserve">all DOM mutation lives here</text>
<rect data-node="store" x="520" y="214" width="320" height="88" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="680" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#059669" text-anchor="middle" font-weight="600" xml:space="preserve">store plugin — the state</text>
<text x="680" y="262" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">set · merge · undo · restoreTo</text>
<text x="680" y="278" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">immutable, structural sharing</text>
<text x="680" y="296" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#98a2b3" text-anchor="middle" font-style="italic" xml:space="preserve">a new object on every commit</text>
<rect data-node="http" x="520" y="336" width="320" height="88" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.4"/>
<text x="680" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#0ea5e9" text-anchor="middle" font-weight="600" xml:space="preserve">http plugin</text>
<text x="680" y="384" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">request(id, url…) · cancel(id)</text>
<text x="680" y="400" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">reply → ctx.dispatch(msg)</text>
<text x="680" y="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#98a2b3" text-anchor="middle" font-style="italic" xml:space="preserve">all network lives here</text>
<rect data-node="logger" x="520" y="458" width="320" height="88" rx="10" fill="#ffffff" stroke="#667085" stroke-width="1.4"/>
<text x="680" y="484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#667085" text-anchor="middle" font-weight="600" xml:space="preserve">logger plugin</text>
<text x="680" y="506" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">every message · every effect</text>
<text x="680" y="522" font-family="ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#667085" text-anchor="middle" xml:space="preserve">history with undo markers</text>
<text x="680" y="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#98a2b3" text-anchor="middle" font-style="italic" xml:space="preserve">feeds the debug panel</text>
<line x1="365" y1="319" x2="520" y2="319" stroke="#7c3aed" stroke-width="1.6"/>
<polygon points="520,319 511,315 511,323" fill="#7c3aed"/>
<text x="442" y="307" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="middle" font-style="italic" xml:space="preserve">handle(effects)</text>
<path d="M 520 441 L 430 441 L 430 394 L 365 394" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<line x1="430" y1="394" x2="365" y2="394" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="365,394 374,398 374,390" fill="#2563eb"/>
<text x="442" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="middle" font-style="italic" xml:space="preserve">dispatch(msg)</text>
<line x1="1210" y1="92" x2="1210" y2="546" stroke="#667085" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="1210" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#667085" text-anchor="middle" font-weight="600" xml:space="preserve">browser</text>
<line x1="840" y1="136" x2="1200" y2="136" stroke="#d97706" stroke-width="1.4"/>
<polygon points="1200,136 1191,132 1191,140" fill="#d97706"/>
<text x="1020" y="124" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="middle" font-style="italic" xml:space="preserve">build · apply(patches)</text>
<line x1="840" y1="258" x2="1200" y2="258" stroke="#059669" stroke-width="1.4"/>
<polygon points="1200,258 1191,254 1191,262" fill="#059669"/>
<text x="1020" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="middle" font-style="italic" xml:space="preserve">the store tab</text>
<line x1="840" y1="378" x2="1200" y2="378" stroke="#0ea5e9" stroke-width="1.4"/>
<polygon points="1200,378 1191,374 1191,382" fill="#0ea5e9"/>
<text x="1020" y="366" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="middle" font-style="italic" xml:space="preserve">fetch()</text>
<line x1="840" y1="502" x2="1200" y2="502" stroke="#667085" stroke-width="1.4"/>
<polygon points="1200,502 1191,498 1191,506" fill="#667085"/>
<text x="1020" y="490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#667085" text-anchor="middle" font-style="italic" xml:space="preserve">the pavlus tab</text>
<line x1="70" y1="576" x2="94" y2="576" stroke="#2563eb" stroke-width="2"/>
<text x="100" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#667085" xml:space="preserve">message (in)</text>
<line x1="185" y1="576" x2="209" y2="576" stroke="#7c3aed" stroke-width="2"/>
<text x="215" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#667085" xml:space="preserve">effect (out)</text>
<line x1="300" y1="576" x2="324" y2="576" stroke="#059669" stroke-width="2"/>
<text x="330" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#667085" xml:space="preserve">state change</text>
<line x1="415" y1="576" x2="439" y2="576" stroke="#d97706" stroke-width="2"/>
<text x="445" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#667085" xml:space="preserve">DOM work</text>
<line x1="530" y1="576" x2="554" y2="576" stroke="#0ea5e9" stroke-width="2"/>
<text x="560" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#667085" xml:space="preserve">network</text>
