# Local Postgres for the shop example (run with OrbStack or any docker):
#   docker compose up -d
# The app and the e2e tests both default to this URL:
#   postgres://admin:admin@127.0.0.1:54329/postgres
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  db-data:
