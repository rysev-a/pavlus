name = "Pavlus"
grammar = "pavlus"
path_suffixes = ["pavlus"]
line_comments = ["// "]
tab_size = 2
hard_tabs = false
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
