<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
    <script src="panel.js" defer></script>
  </head>
  <body>
    <header id="bar">
      <span id="dot" class="off"></span>
      <span id="status">connecting…</span>
      <span class="spacer"></span>
      <button id="rescan" title="Ask the page for pavlus agents again">
        rescan
      </button>
    </header>

    <nav id="tabs">
      <button data-tab="console" class="active">Console</button>
      <button data-tab="store">Store</button>
      <button data-tab="travel">Time travel</button>
      <button data-tab="apps">Application</button>
    </nav>

    <main id="view">
      <section id="tab-console" class="tab active"></section>
      <section id="tab-store" class="tab"></section>
      <section id="tab-travel" class="tab"></section>
      <section id="tab-apps" class="tab"></section>
    </main>
  </body>
</html>
