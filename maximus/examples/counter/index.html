<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maximus counter</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f6f7fb; color: #1b1f33; }
      main { background: #fff; padding: 2rem 2.5rem; border-radius: 16px; box-shadow: 0 8px 30px #1b1f3318; text-align: center; min-width: 18rem; }
      h1 { margin: 0 0 .25rem; font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; color: #5b5fc7; }
      .value { font-size: 4rem; font-weight: 700; margin: .5rem 0; font-variant-numeric: tabular-nums; }
      .value.neg { color: #c0392b; }
      button { font: inherit; border: 0; background: #5b5fc7; color: #fff; padding: .5rem 1.1rem; border-radius: 10px; cursor: pointer; margin: 0 .2rem; }
      button.secondary { background: #e4e5f5; color: #35388f; }
      button:disabled { opacity: .4; cursor: not-allowed; }
      p { color: #6b7090; margin: .75rem 0 0; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
