<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maximus dashboard</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #fff;
        --ink: #1b1f33;
        --muted: #5d6384;
        --line: #dfe1ef;
        --accent: #3d40b8;
        /* Okabe-Ito categorical palette, colour-blind safe */
        --series-0: #0072b2;
        --series-1: #e69f00;
        --series-2: #009e73;
        --series-3: #cc79a7;
        --series-4: #56b4e9;
        --series-5: #d55e00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14151f;
          --card: #1d1f2d;
          --ink: #eceefb;
          --muted: #a0a5c8;
          --line: #34374f;
          --accent: #9a9df5;
          --series-0: #56b4e9;
          --series-1: #f0c24b;
          --series-2: #2fc99a;
          --series-3: #e59ac3;
          --series-4: #8cc9f2;
          --series-5: #ef8a4a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      #app {
        max-width: 70rem;
        margin: 0 auto;
        padding: 1rem;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-weight: 600;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }
      .controls label {
        color: var(--muted);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      button,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.3rem 0.8rem;
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent);
        outline-offset: 2px;
      }
      .kpis {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1.5rem;
        color: var(--muted);
      }
      .kpis b {
        color: var(--ink);
        font-size: 1.3rem;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1rem;
        min-width: 0;
      }
      .panel.wide {
        grid-column: 1 / -1;
      }
      .chart {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .chart text {
        fill: var(--muted);
        font-size: 11px;
        font-family: inherit;
      }
      .chart .grid line {
        stroke: var(--line);
      }
      .chart .area {
        opacity: 0.12;
      }
      .chart .line {
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .chart .bar .name {
        fill: var(--ink);
        font-size: 12px;
      }
      .chart .bar .value {
        fill: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .chart .big {
        fill: var(--ink);
        font-size: 22px;
        font-weight: 700;
      }
      .chart circle {
        transition:
          stroke-dasharray 0.4s ease,
          stroke-dashoffset 0.4s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        .chart * {
          transition: none !important;
        }
      }
      .donut {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .donut svg {
        width: 9.5rem;
        flex: none;
      }
      .legend {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .swatch {
        display: inline-block;
        width: 0.8rem;
        height: 0.8rem;
        border-radius: 3px;
        margin-right: 0.35rem;
        vertical-align: -1px;
      }
      .scroll {
        max-height: 18rem;
        overflow: auto;
      }
      table.sales {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      table.sales th,
      table.sales td {
        padding: 0.35rem 0.6rem;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      table.sales th {
        position: sticky;
        top: 0;
        background: var(--card);
      }
      table.sales th button {
        border: 0;
        padding: 0;
        background: none;
        font-weight: 600;
        color: var(--ink);
        border-radius: 4px;
      }
      .num {
        text-align: right !important;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      @media (max-width: 44rem) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
