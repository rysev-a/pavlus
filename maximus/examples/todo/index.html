<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maximus todo</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f6f7fb; color: #1b1f33; }
      .todoapp { max-width: 34rem; margin: 3rem auto; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px #1b1f3318; overflow: hidden; }
      header { padding: 1.25rem 1.5rem 0; }
      h1 { margin: 0 0 .75rem; font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; color: #5b5fc7; }
      .new { width: 100%; box-sizing: border-box; font: inherit; padding: .65rem .8rem; border: 2px solid #e4e5f5; border-radius: 10px; }
      .new:focus { outline: none; border-color: #5b5fc7; }
      ul { list-style: none; margin: .75rem 0 0; padding: 0; }
      li { display: flex; align-items: center; gap: .75rem; padding: .6rem 1.5rem; border-top: 1px solid #f0f1f8; }
      li label { flex: 1; cursor: pointer; }
      li.done label { text-decoration: line-through; color: #9a9db8; }
      li .edit { flex: 1; font: inherit; padding: .2rem .4rem; }
      li button { visibility: hidden; border: 0; background: none; color: #c0392b; font-size: 1.1rem; cursor: pointer; }
      li:hover button { visibility: visible; }
      footer { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .75rem 1.5rem; border-top: 1px solid #f0f1f8; font-size: .9rem; color: #6b7090; flex-wrap: wrap; }
      .filters { display: flex; gap: .25rem; }
      .filters button, .clear { font: inherit; border: 1px solid transparent; background: none; padding: .15rem .6rem; border-radius: 8px; cursor: pointer; color: inherit; }
      .filters button.on { border-color: #5b5fc7; color: #35388f; }
      .empty { padding: 1.5rem; text-align: center; color: #9a9db8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
