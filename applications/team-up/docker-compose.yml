# The experiment's infrastructure: Postgres for the world, Redis for the live
# parts (pub/sub fanout of chat across workers + the notification queue).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: teamup
      POSTGRES_DB: team_up
    ports:
      - "5434:5432"
    volumes:
      - team-up-db:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  team-up-db:
