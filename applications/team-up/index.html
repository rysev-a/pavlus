    <!-- the original teamUP styles, copied as-is: fonts and base (main),
         responsive (media), the auth pages, the public site (startups,
         startup_detail, blog, users, search), the app shell, the profile
         forms, the person pages, the chat, the projects. port.css holds the
         few things the port adds.

         The original serves two sets of stylesheets: the public site (the
         server-rendered marketing pages) and the SPA (the signed-in app).
         The port renders both from one document, so it loads both: the
         public set last, so the public pages keep the original's look
         (the SPA's pages use their own class names and do not collide). -->
